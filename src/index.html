<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EnergyOS — Renewable Intelligence Platform</title>
  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/dashboard.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <!-- Sidebar Navigation -->
  <nav class="sidebar" id="sidebar">

        <path d="M16 6 L20 14 L16 12 L12 20 L16 18 L12 26" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      <span class="brand-name">EnergyOS</span>
    </div>

    <ul class="nav-links">
      <li><a href="#" class="nav-item active" data-page="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        <span>Dashboard</span>
      </a></li>
      <li><a href="#" class="nav-item" data-page="forecast">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <span>Demand Forecast</span>
      </a></li>
      <li><a href="#" class="nav-item" data-page="loadbalancer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>
        <span>Load Balancing</span>
      </a></li>
      <li><a href="#" class="nav-item" data-page="anomaly">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span>Anomaly Detection</span>
      </a></li>
      <li><a href="#" class="nav-item" data-page="rootcause">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        <span>Root Cause Analysis</span>
      </a></li>
      <li><a href="#" class="nav-item" data-page="brief">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        <span>Operator Brief</span>
      </a></li>
    </ul>

    <div class="sidebar-footer">
      <div class="system-status">
        <span class="status-dot online"></span>
        <span>Grid Systems Online</span>
      </div>
      <div class="last-updated" id="lastUpdated">Updated: --:--:--</div>
    </div>
  </nav>

  <!-- Mobile Top Bar -->
  <header class="topbar">
    <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <span class="topbar-title" id="topbarTitle">Dashboard</span>
    <div class="topbar-actions">
      <button class="btn btn-sm btn-primary" id="refreshBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        Refresh
      </button>
      <div class="alert-badge" id="alertBadge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="alert-count" id="alertCount">0</span>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content" id="mainContent">
    <!-- Pages are loaded here dynamically -->
    <div class="page-loader" id="pageLoader">
      <div class="loader-spinner"></div>
      <p>Loading...</p>
    </div>
  </main>

  <!-- Toast Notifications -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Scripts -->
  <script src="assets/js/core/data.js"></script>
  <script src="assets/js/core/charts.js"></script>
  <script src="assets/js/modules/forecast.js"></script>
  <script src="assets/js/modules/loadbalancer.js"></script>
  <script src="assets/js/modules/anomaly.js"></script>
  <script src="assets/js/modules/rootcause.js"></script>
  <script src="assets/js/modules/brief.js"></script>
  <script src="assets/js/core/app.js"></script>
</body>
</html>
